[project]
name = "jarvis"
version = "1.0.0"
description = "Голосовой ассистент на Python с плагинной архитектурой"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.2.70",
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "rapidfuzz>=3.9.0",
    "ddgs>=0.6.0",
    "requests>=2.31.0",
    "pyperclip>=1.8.2",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "pywin32>=306",
    "psutil>=5.9.0",
    "keyboard>=0.13.5",
    "pycaw>=20220620",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "SIM103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"